<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Machine · Map preview</title>
<style>
*{box-sizing:border-box}:root{--video-aspect:.5625;--video-width:1080px}body{margin:0;background:#161e21;color:#ece5d4;font:14px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(100vw,calc((100vh - 92px)*var(--video-aspect)));padding:0}#screen{width:100%;aspect-ratio:var(--video-aspect)}canvas{width:100%;height:100%;display:block}nav{display:flex;gap:12px;align-items:center;padding:12px 6px}input{flex:1;min-width:0;accent-color:#d1a456}button,select{background:#d1a456;border:0;border-radius:4px;padding:8px;color:#172125;font-weight:700}small{color:#aeb7ad}body.export{display:block;background:#000}body.export main{width:var(--video-width);padding:0}body.export nav,body.export small{display:none}#error{white-space:pre-wrap;color:#ffbba7}
</style>
<main><div id="screen" role="status" aria-label="Map preview">Loading map…</div><nav><button id="play" disabled>Play</button><input id="seek" type="range" min="0" step="0.02" value="0" disabled><span id="time">0:00</span><select id="format" aria-label="Video format"><option value="portrait">9:16</option><option value="landscape">16:9</option></select></nav><small>Schematic map · symbolic units · silent preview</small><div id="error" role="alert"></div></main>
<script src="boot.js"></script></html>
