<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Machine · Map preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#161e21;color:#ece5d4;font:14px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(100vw,440px);padding:12px}#screen{width:100%;aspect-ratio:9/16;box-shadow:0 20px 70px #0007}canvas{width:100%;height:100%;display:block}nav{display:flex;gap:12px;align-items:center;padding:14px 0}input{flex:1;min-width:0;accent-color:#d1a456}button{background:#d1a456;border:0;border-radius:4px;padding:8px 14px;color:#172125;font-weight:700}small{color:#aeb7ad}body.export{display:block;background:#000}body.export main{width:1080px;padding:0}body.export nav,body.export small{display:none}#error{white-space:pre-wrap;color:#ffbba7}
</style>
<main><div id="screen"></div><nav><button id="play">Play</button><input id="seek" type="range" min="0" step="0.02" value="0"><span id="time">0:00</span></nav><small>Schematic map · symbolic units · silent preview</small><div id="error"></div></main>
<script src="pixi.min.js"></script><script type="module" src="player.mjs"></script></html>
